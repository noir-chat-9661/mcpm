name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Run tests
        run: go test -v ./...

      - name: Build cross-platform archives
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          for GOOS in darwin linux; do
            for GOARCH in amd64 arm64; do
              STAGE="mcpm_${VERSION}_${GOOS}_${GOARCH}"
              mkdir -p "dist/${STAGE}"
              CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" go build -trimpath -ldflags="-s -w" -o "dist/${STAGE}/mcpm" ./cmd/mcpm
              CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" go build -trimpath -ldflags="-s -w" -o "dist/${STAGE}/mcpmd" ./cmd/mcpmd
              cp README.md LICENSE "dist/${STAGE}/"
              tar -C dist -czf "dist/${STAGE}.tar.gz" "${STAGE}"
              rm -rf "dist/${STAGE}"
            done
          done
          cd dist
          sha256sum *.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/SHA256SUMS \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
